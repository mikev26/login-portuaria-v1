{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Tarifas | Autoridad Portuaria</title>
    <link rel="stylesheet" href="{% static 'bitacora/css/tarifa_listado.css' %}">
</head>
<body>

<div class="container">
    <header>
        <h1>Listado de Tarifas Existentes</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <!-- Opciones de Filtro (Selección única) -->
            <div class="filter-options" style="display: flex; gap: 15px; align-items: center; font-size: 13px; font-weight: 600; color: white;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;">
                    <input type="radio" name="filtroTarifas" value="activas" {% if filtro != 'todas' %}checked{% endif %} onchange="aplicarFiltro(this.value)" style="width: auto; cursor: pointer; margin: 0; accent-color: var(--amber);">
                    Activas
                </label>
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;">
                    <input type="radio" name="filtroTarifas" value="todas" {% if filtro == 'todas' %}checked{% endif %} onchange="aplicarFiltro(this.value)" style="width: auto; cursor: pointer; margin: 0; accent-color: var(--amber);">
                    Todas
                </label>
            </div>
            
            <!-- Botón Exportar -->
            <button class="btn-export" onclick="exportToExcel()">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                Exportar Excel
            </button>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Escribe para buscar por tasa, código o descripción de tarifa..." autocomplete="off">
    </div>

    <div class="table-wrap">
        <table id="tarifasTable">
            <thead>
                <tr>
                    <th style="width: 25%">Tasa</th>
                    <th style="width: 15%">Codigo</th>
                    <th style="width: 60%">Tarifa</th>
                </tr>
            </thead>
            <tbody>
                {% for t in tarifas %}
                <tr data-tarifa="{{ t.json_data }}">
                    <td>{{ t.tasa }}</td>
                    <td>{{ t.codigo }}</td>
                    <td>{{ t.tarifa }}</td>
                </tr>
                {% empty %}
                <tr class="empty-row">
                    <td colspan="3" class="empty">No existen tarifas registradas.</td>
                </tr>
                {% endfor %}
                <tr id="emptyRow" class="empty-row" style="display: none;">
                    <td colspan="3" class="empty">No se encontraron coincidencias.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const rows = document.querySelectorAll('tbody tr:not(.empty-row)');
        
        // click selector logic to update parent form
        rows.forEach(row => {
            row.addEventListener('click', () => {
                const rawData = row.dataset.tarifa;
                if (rawData) {
                    try {
                        const data = JSON.parse(rawData);
                        if (window.opener && typeof window.opener.loadTarifaData === 'function') {
                            window.opener.loadTarifaData(data);
                            if (typeof window.opener.showToast === 'function') {
                                window.opener.showToast(`Tarifa [${data.codigo}] cargada correctamente.`);
                            }
                            window.close();
                        } else {
                            alert('No se pudo encontrar la ventana principal del Tarifario.');
                        }
                    } catch (e) {
                        console.error("Error parsing row data:", e);
                    }
                }
            });
        });

        // live search/filtering logic
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.focus();
            
            searchInput.addEventListener('input', function() {
                const term = this.value.trim().toLowerCase();
                let matchCount = 0;

                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    if (text.includes(term)) {
                        row.style.display = '';
                        matchCount++;
                    } else {
                        row.style.display = 'none';
                    }
                });

                const emptyRow = document.getElementById('emptyRow');
                if (matchCount === 0 && rows.length > 0) {
                    emptyRow.style.display = '';
                } else {
                    emptyRow.style.display = 'none';
                }
            });
        }
    });

    function aplicarFiltro(val) {
        window.location.href = `?filtro=${val}`;
    }

    function exportToExcel() {
        const urlParams = new URLSearchParams(window.location.search);
        const filtro = urlParams.get('filtro') || 'activas';
        const searchInput = document.getElementById('searchInput');
        const q = searchInput ? searchInput.value.trim() : '';
        window.location.href = `/tarifa/exportar/?filtro=${filtro}&q=${encodeURIComponent(q)}`;
    }
</script>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Tarifas | Autoridad Portuaria</title>
    <style>
        :root {
            --navy-deep: #062d52;
            --navy: #0d4777;
            --blue: #1d6f9f;
            --amber: #f4b63f;
            --surface: #edf2f6;
            --card: #ffffff;
            --border: #d7e0e8;
            --text: #1d2d3d;
            --muted: #66788a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: var(--surface);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(6,45,82,.08);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        header {
            padding: 16px 20px;
            color: white;
            background: linear-gradient(120deg, var(--navy-deep), var(--navy));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: .3px;
        }
        .search-container {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }
        .search-container input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13.5px;
            transition: all 0.2s;
            outline: none;
        }
        .search-container input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(29,111,159,.15);
        }
        .table-wrap {
            max-height: 480px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            padding: 12px 16px;
            text-align: left;
            background: var(--navy-deep);
            color: white;
            font-size: 11.5px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            transition: all 0.15s;
        }
        tbody tr {
            cursor: pointer;
        }
        tbody tr:hover {
            background: rgba(29,111,159,.08);
        }
        tbody tr:active {
            background: rgba(29,111,159,.15);
        }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Listado de Tarifas Existentes</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Escribe para buscar por tasa, código o descripción de tarifa..." autocomplete="off">
    </div>

    <div class="table-wrap">
        <table id="tarifasTable">
            <thead>
                <tr>
                    <th style="width: 25%">Tasa</th>
                    <th style="width: 15%">Codigo</th>
                    <th style="width: 60%">Tarifa</th>
                </tr>
            </thead>
            <tbody>
                {% for t in tarifas %}
                <tr data-tarifa="{{ t.json_data }}">
                    <td>{{ t.tasa }}</td>
                    <td>{{ t.codigo }}</td>
                    <td>{{ t.tarifa }}</td>
                </tr>
                {% empty %}
                <tr class="empty-row">
                    <td colspan="3" class="empty">No existen tarifas registradas.</td>
                </tr>
                {% endfor %}
                <tr id="emptyRow" class="empty-row" style="display: none;">
                    <td colspan="3" class="empty">No se encontraron coincidencias.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const rows = document.querySelectorAll('tbody tr:not(.empty-row)');
        
        // click selector logic to update parent form
        rows.forEach(row => {
            row.addEventListener('click', () => {
                const rawData = row.dataset.tarifa;
                if (rawData) {
                    try {
                        const data = JSON.parse(rawData);
                        if (window.opener && typeof window.opener.loadTarifaData === 'function') {
                            window.opener.loadTarifaData(data);
                            if (typeof window.opener.showToast === 'function') {
                                window.opener.showToast(`Tarifa [${data.codigo}] cargada correctamente.`);
                            }
                            window.close();
                        } else {
                            alert('No se pudo encontrar la ventana principal del Tarifario.');
                        }
                    } catch (e) {
                        console.error("Error parsing row data:", e);
                    }
                }
            });
        });

        // live search/filtering logic
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.focus();
            
            searchInput.addEventListener('input', function() {
                const term = this.value.trim().toLowerCase();
                let matchCount = 0;

                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    if (text.includes(term)) {
                        row.style.display = '';
                        matchCount++;
                    } else {
                        row.style.display = 'none';
                    }
                });

                const emptyRow = document.getElementById('emptyRow');
                if (matchCount === 0 && rows.length > 0) {
                    emptyRow.style.display = '';
                } else {
                    emptyRow.style.display = 'none';
                }
            });
        }
    });
</script>

</body>
</html>
